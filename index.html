
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2253A3">
  <title>受付システム</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">

    <!-- ホーム画面 -->
    <section id="homePage">

      <header class="header">
        <h1>受付システム</h1>
        <p>QRコードまたは氏名で受付してください。</p>
      </header>

      <section class="panel camera-panel">
        <div class="panel-heading">
          <h2>QRコード受付</h2>
          <span id="cameraStatus" class="status">起動準備中</span>
        </div>

        <div id="reader"></div>

        <p id="cameraMessage" class="message">
          カメラを起動しています...
        </p>
      </section>

      <section class="panel">
        <h2>氏名から検索</h2>

        <div class="search-row">
          <input
            id="nameInput"
            type="text"
            placeholder="参加者の氏名を入力"
            autocomplete="off">

          <button id="searchButton" type="button">
            検索
          </button>
        </div>

        <div id="searchResults"></div>
      </section>

      <p id="homeMessage" class="message"></p>

    </section>


    <!-- 確認画面 -->
    <section id="confirmPage" class="hidden">

      <header class="header">
        <h1>参加者情報の確認</h1>
        <p>受付する参加者に間違いがないか確認してください。</p>
      </header>

      <section class="panel">

        <div class="info-row">
          <span>ID</span>
          <strong id="confirmId"></strong>
        </div>

        <div class="info-row">
          <span>氏名</span>
          <strong id="confirmName"></strong>
        </div>

        <div class="info-row">
          <span>フリガナ</span>
          <strong id="confirmFurigana"></strong>
        </div>

        <div class="info-row">
          <span>クラス</span>
          <strong id="confirmClass"></strong>
        </div>

        <div class="info-row">
          <span>会費</span>
          <strong id="confirmFee"></strong>
        </div>

      </section>

      <div id="duplicateMessage" class="warning hidden">
        この参加者は既に受付済みです。
        再受付する場合は係員に確認してください。
      </div>

      <button id="receptionButton" type="button">
        この内容で受付する
      </button>

      <button id="backButton" class="secondary-button" type="button">
        戻る
      </button>

    </section>


    <!-- 完了画面 -->
    <section id="completePage" class="hidden">

      <section class="complete-panel">
        <div class="check-icon">✓</div>

        <h1>受付完了</h1>

        <h2 id="completeName"></h2>

        <p id="completeTime"></p>

        <button id="nextButton" type="button">
          次の方の受付へ
        </button>
      </section>

    </section>

  </main>

  <!-- 受付記録送信用iframe -->
  <iframe
    name="postFrame"
    id="postFrame"
    class="hidden-frame">
  </iframe>

  <form
    id="postForm"
    method="POST"
    target="postFrame"
    class="hidden-frame">

    <input name="id" id="postId">
    <input name="method" id="postMethod">
    <input name="allowDuplicate" id="postAllowDuplicate">
    <input name="requestId" id="postRequestId">

  </form>

  <script src="script.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="scanner.js"></script>
</body>
</html>
